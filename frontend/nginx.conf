server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # PGN uploads; the API enforces its own (smaller) limit.
    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Re-resolve the backend through Docker's DNS: a recreated backend container gets a new
    # IP, and a name resolved only once at startup would then answer 502 until a restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;  # a variable makes nginx resolve per request (cached 10s)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;  # lessons and improvement plans can take a while
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
